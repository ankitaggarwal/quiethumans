<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawl Status - quiethumans.fyi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }
        .status-healthy { background: #22c55e; }
        .status-warning { background: #eab308; }
        .status-critical { background: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .section {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .section h2 {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
        }
        .stat-label {
            font-size: 0.875rem;
            color: #666;
            margin-top: 0.25rem;
        }
        .stat-value.pending { color: #3b82f6; }
        .stat-value.crawled { color: #22c55e; }
        .stat-value.failed { color: #ef4444; }
        .stat-value.approved { color: #22c55e; }
        .stat-value.rejected { color: #f97316; }
        .stat-value.pending-review { color: #eab308; }
        .sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .source-tag {
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }
        .source-count {
            color: #888;
            margin-left: 0.25rem;
        }
        .updated {
            text-align: center;
            color: #444;
            font-size: 0.75rem;
            margin-top: 1.5rem;
        }
        .error {
            background: #1a0000;
            border-color: #4a0000;
            color: #ff6b6b;
            padding: 1rem;
            text-align: center;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .nav {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/">&larr; Back to Home</a>
        </nav>

        <h1>
            <span id="status-dot" class="status-indicator status-healthy"></span>
            Crawl Status
        </h1>

        <div id="content">
            <div class="section">
                <p style="color: #666;">Loading...</p>
            </div>
        </div>

        <p id="updated" class="updated"></p>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/crawl/stats');
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                renderStats(data);
            } catch (e) {
                showError('Failed to fetch stats: ' + e.message);
            }
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="section error">${message}</div>
            `;
        }

        function renderStats(data) {
            const { queue, sources, people } = data;

            // Update status indicator
            const dot = document.getElementById('status-dot');
            if (queue.pending === 0) {
                dot.className = 'status-indicator status-critical';
            } else if (queue.pending < 100) {
                dot.className = 'status-indicator status-warning';
            } else {
                dot.className = 'status-indicator status-healthy';
            }

            // Build sources list
            let sourcesHtml = '';
            if (sources && Object.keys(sources).length > 0) {
                const sortedSources = Object.entries(sources).sort((a, b) => b[1] - a[1]);
                sourcesHtml = sortedSources.map(([name, count]) =>
                    `<span class="source-tag">${name}<span class="source-count">${count.toLocaleString()}</span></span>`
                ).join('');
            } else {
                sourcesHtml = '<span style="color: #666;">No pending URLs by source</span>';
            }

            document.getElementById('content').innerHTML = `
                <div class="section">
                    <h2>URL Queue</h2>
                    <div class="stat-grid">
                        <div class="stat">
                            <div class="stat-value pending">${queue.pending.toLocaleString()}</div>
                            <div class="stat-label">Pending</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" style="color: #a855f7;">${(queue.in_progress || 0).toLocaleString()}</div>
                            <div class="stat-label">In Progress</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value crawled">${queue.crawled.toLocaleString()}</div>
                            <div class="stat-label">Crawled</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value failed">${queue.failed.toLocaleString()}</div>
                            <div class="stat-label">Failed</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Pending by Source</h2>
                    <div class="sources-list">${sourcesHtml}</div>
                </div>

                <div class="section">
                    <h2>People</h2>
                    <div class="stat-grid">
                        <div class="stat">
                            <div class="stat-value">${people.total.toLocaleString()}</div>
                            <div class="stat-label">Total</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value approved">${people.approved.toLocaleString()}</div>
                            <div class="stat-label">Approved</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value pending-review">${people.pending_review.toLocaleString()}</div>
                            <div class="stat-label">Pending Review</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value rejected">${people.rejected.toLocaleString()}</div>
                            <div class="stat-label">Rejected</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('updated').textContent =
                'Last updated: ' + new Date().toLocaleTimeString();
        }

        // Initial fetch
        fetchStats();

        // Auto-refresh every 30 seconds
        setInterval(fetchStats, 30000);
    </script>
</body>
</html>
