# Three small services, all on one droplet:
#   web      - the FastAPI app (search API + frontend + /mcp)
#   pipeline - the continuous crawler (same image, different command)
#   caddy    - reverse proxy that terminates HTTPS and forwards to web
#
# Postgres, Qdrant and the LLM are all external (set in backend/.env), so we
# don't run a database here.

services:
  web:
    build: .
    image: quiethumans:latest          # built once here, reused by pipeline
    env_file: backend/.env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"                          # internal only; Caddy is the public door
    restart: unless-stopped

  pipeline:
    image: quiethumans:latest           # reuses the image built by web
    env_file: backend/.env
    command: python -m pipeline --continuous --workers 1 --batch 10
    depends_on:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # stores the Let's Encrypt certificate
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
